name = "retired-heart"
main = "src/worker.js"
compatibility_date = "2025-01-01"
# Keep variables and secrets you add in the Cloudflare dashboard when redeploying.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# Run the API code first for /api/*; everything else is served as plain website files.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "retired-heart"
# Paste your Database ID here (Cloudflare dashboard > D1 > retired-heart > Database ID).
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"